# Builds the website on every push and pull request; publishes it to
# GitHub Pages from main. The build output is plain static files, so any
# web server can host it instead.
name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

env:
  # renovate: datasource=github-releases depName=gohugoio/hugo
  HUGO_VERSION: v0.170.0

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Hugo
        run: |
          v="${HUGO_VERSION#v}"
          base="https://github.com/gohugoio/hugo/releases/download/${HUGO_VERSION}"
          file="hugo_extended_${v}_linux-amd64.tar.gz"
          curl -fsSLO "${base}/${file}"
          curl -fsSLO "${base}/hugo_${v}_checksums.txt"
          grep " ${file}\$" "hugo_${v}_checksums.txt" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/hugo"
          tar -xzf "${file}" -C "${RUNNER_TEMP}/hugo" hugo
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"
          rm "${file}" "hugo_${v}_checksums.txt"
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: hugo --gc --minify --panicOnWarning ${BASE_URL:+--baseURL "${BASE_URL}/"}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
