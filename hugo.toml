# baseURL is set by the deployment (HUGO_BASEURL or --baseURL). All links in
# the templates are relative to it, so the site runs under any host or path.
baseURL = "/"
locale = "en"
defaultContentLanguage = "en"
title = "nomira"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "rss"]

[params]
  description = "nomira builds an immutable Linux system from a recipe: Arch packages, ordinary configuration files, atomic updates with bootc."
  status = "alpha"
  github = "https://github.com/Nomira-OS"

[markup.goldmark.renderer]
  unsafe = false
[markup.highlight]
  codeFences = true
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[menus]
  [[menus.main]]
    name = "Frontend"
    pageRef = "/frontend"
    weight = 10
  [[menus.main]]
    name = "Compare"
    pageRef = "/compare"
    weight = 20
  [[menus.main]]
    name = "FAQ"
    pageRef = "/faq"
    weight = 30
  [[menus.main]]
    name = "Docs"
    pageRef = "/docs"
    weight = 40
