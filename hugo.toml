# baseURL is set by the deployment (HUGO_BASEURL or --baseURL). All links in
# the templates are relative to it, so the site runs under any host or path.
baseURL = "/"
locale = "de"
defaultContentLanguage = "de"
title = "nomira"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "rss"]

[params]
  description = "nomira baut unveränderliche Linux-Systeme aus einem deklarativen Recipe: Arch-Pakete, gewöhnliche Konfigurationsdateien, atomare Updates mit bootc."
  status = "alpha"
  github = "https://github.com/Nomira-OS"

[markup.goldmark.renderer]
  unsafe = false
[markup.highlight]
  codeFences = true
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[menus]
  [[menus.main]]
    name = "Frontend"
    pageRef = "/frontend"
    weight = 10
  [[menus.main]]
    name = "Vergleich"
    pageRef = "/vergleich"
    weight = 20
  [[menus.main]]
    name = "FAQ"
    pageRef = "/faq"
    weight = 30
  [[menus.main]]
    name = "Doku"
    pageRef = "/doku"
    weight = 40
