{{- /* Wide tables scroll inside their own focusable region instead of the page. */ -}}
<div class="table-scroll" role="region" aria-label="Tabelle, bei Bedarf seitlich scrollbar" tabindex="0">
<table>
  <thead>
    {{- range .THead }}
    <tr>
      {{- range . }}
      <th scope="col">{{ .Text }}</th>
      {{- end }}
    </tr>
    {{- end }}
  </thead>
  <tbody>
    {{- range .TBody }}
    <tr>
      {{- range $i, $cell := . }}
      {{- if eq $i 0 }}<th scope="row">{{ $cell.Text }}</th>{{ else }}<td>{{ $cell.Text }}</td>{{ end }}
      {{- end }}
    </tr>
    {{- end }}
  </tbody>
</table>
</div>
