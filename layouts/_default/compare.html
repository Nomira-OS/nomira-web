{{ define "main" }}
<article class="wrap page">
  <header class="page-header">
    {{- if .Parent }}{{ if not .Parent.IsHome }}<p class="crumb"><a href="{{ .Parent.RelPermalink }}">{{ .Parent.Title }}</a></p>{{ end }}{{ end }}
    <h1>{{ .Title }}</h1>
    {{- with .Params.lead }}<p class="lead">{{ . }}</p>{{ end }}
  </header>
  {{ partial "axes.html" . }}
  <div class="prose">
    {{ .Content }}
  </div>
</article>
{{ end }}
