{{ define "main" }}
<div class="wrap page">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{- with .Params.lead }}<p class="lead">{{ . }}</p>{{ end }}
  </header>
  <div class="prose">{{ .Content }}</div>
  <ul class="card-list">
    {{- range .Pages.ByWeight }}
    <li class="card">
      <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      {{- with .Params.lead }}<p>{{ . }}</p>{{ end }}
      {{- if .Params.untested }}<p class="tag">Draft, not tried yet</p>{{ end }}
    </li>
    {{- end }}
  </ul>
</div>
{{ end }}
