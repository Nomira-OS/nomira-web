{{ define "main" }}
<article class="wrap page">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{- with .Params.lead }}<p class="lead">{{ . }}</p>{{ end }}
  </header>

  <figure class="axes">
    <figcaption>Wo die beiden Projekte stehen. Die Lage der Marken ist eine Einordnung, keine Messung.</figcaption>
    <div class="axis">
      <p class="axis-title">Woher kommt die Ordnung?</p>
      <div class="axis-ends"><span>Eigene Sprache, vor dem Bau geprüft</span><span>Gewöhnliche Befehle und Dateien, beim Bau geprüft</span></div>
      <div class="track" aria-hidden="true"><span class="mark nix" style="left: 8%">NixOS</span><span class="mark nom" style="left: 84%">nomira</span></div>
      <p class="axis-text">NixOS steht bei der eigenen Sprache, nomira bei gewöhnlichen Befehlen und Dateien.</p>
    </div>
    <div class="axis">
      <p class="axis-title">Wie genau lässt sich ein Stand wiederholen?</p>
      <div class="axis-ends"><span>Jede Eingabe festgelegt</span><span>Paketstand über ein Datum</span></div>
      <div class="track" aria-hidden="true"><span class="mark nix" style="left: 8%">NixOS</span><span class="mark nom" style="left: 70%">nomira</span></div>
      <p class="axis-text">NixOS legt jede Eingabe fest. nomira legt den Paketstand über ein Datum fest.</p>
    </div>
    <div class="axis">
      <p class="axis-title">Wie reif ist das Projekt?</p>
      <div class="axis-ends"><span>Seit vielen Jahren erprobt</span><span>Früher Entwicklungsstand</span></div>
      <div class="track" aria-hidden="true"><span class="mark nix" style="left: 6%">NixOS</span><span class="mark nom" style="left: 92%">nomira</span></div>
      <p class="axis-text">NixOS ist seit vielen Jahren erprobt. nomira ist in einem frühen Entwicklungsstand.</p>
    </div>
  </figure>

  <div class="prose">
    {{ .Content }}
  </div>
</article>
{{ end }}
