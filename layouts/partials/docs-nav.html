<nav class="side" aria-label="Docs">
  <h2>Docs</h2>
  <ul>
    {{ $cur := . }}
    {{ with site.GetPage "/docs" }}
    <li><a href="{{ .RelPermalink }}" {{ if eq $cur .  }}aria-current="page"{{ end }}>Overview</a></li>
    {{ range .Pages.ByWeight }}
    <li><a href="{{ .RelPermalink }}" {{ if eq $cur . }}aria-current="page"{{ end }}>{{ .Title }}</a></li>
    {{ end }}
    {{ end }}
  </ul>
</nav>
